<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotización Markip · Registro de Marca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-header">
      <div class="shell-brand">
        <img src="markip-icon-purple.png" alt="Markip" class="shell-logo-img" />
        <span class="shell-brand-sep">·</span>
        <span class="shell-brand-sub">Cotizador</span>
      </div>
      <div class="shell-actions" id="shell-actions"></div>
    </header>

    <section class="controls" id="controls"></section>

    <div id="v1-stage" class="stage active" data-screen-label="01 Protagonista"></div>

    <footer class="shell-footer">
      <div>Cotización referencial · UTM junio 2026 · Markip®</div>
      <div>Ctrl/Cmd + P para imprimir</div>
    </footer>
  </div>

  <div class="tweaks" id="tweaks"></div>
  <div id="history-panel"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="calc.js"></script>
  <script type="text/babel" data-presets="react" src="v1.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
