<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotización Markip · Registro de Marca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-header">
      <div class="shell-brand">
        <img src="markip-icon-purple.png" alt="Markip" class="shell-logo-img" />
        <span class="shell-brand-sep">·</span>
        <span class="shell-brand-sub">Cotizador</span>
      </div>
    </header>

    <section class="controls" id="controls"></section>

    <div id="v1-stage" class="stage active" data-screen-label="01 Protagonista"></div>

    <footer class="shell-footer">
      <div>Cotización referencial · UTM junio 2026 · Markip®</div>
      <div>Ctrl/Cmd + P para imprimir</div>
    </footer>
  </div>

  <div class="tweaks" id="tweaks"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="calc.js"></script>
  <script src="v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
